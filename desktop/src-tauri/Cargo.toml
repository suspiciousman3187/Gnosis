[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "devtools", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
# Native folder picker for the data-dir Browse button + the auto-detect
# helper. Without this, the Settings input is a bare text field and users
# have to type Windows paths from memory.
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# At-rest gzip for the encounter library. `flate2` is the standard Rust
# zlib/gzip wrapper —`read_text_file` auto-decompresses by magic-byte sniff,
# and `compress_idle_files` is the background pass App.tsx schedules.
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"

# Foreground-window detection for "Show Only Over FFXI" (overlay focus-follow).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

# Release profile tuned for installer build speed, not micro-benchmark perf.
# Tauri apps are GUI-bound (heavy lifting is in the WebView2 / Chromium
# process), so cranking `opt-level = 3` on the Rust shell costs ~2 minutes
# of LLVM codegen for negligible perceived runtime gain. `opt-level = 1`
# gives ~3—faster builds with no user-visible slowdown.
[profile.release]
opt-level     = 1
codegen-units = 16
lto           = false
debug         = false
strip         = "symbols"

